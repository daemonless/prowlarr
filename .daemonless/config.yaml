icon: ':material-magnet:'
cit:
  mode: screenshot
  port: 9696

build:
  variants:
    - tag: latest
      containerfile: Containerfile
      default: true
    - tag: develop
      containerfile: Containerfile
      args:
        PROWLARR_BRANCH: develop
      tag_desc: "**Develop branch** — pre-release/beta channel, more tested than nightly. One-way DB migrations; back up /config before switching back to release."
    - tag: nightly
      containerfile: Containerfile
      args:
        PROWLARR_BRANCH: nightly
      tag_desc: "**Nightly branch** — bleeding-edge pre-release build. One-way DB migrations; back up /config before switching back to release."
    - tag: pkg
      containerfile: Containerfile.pkg
    - tag: pkg-latest
      containerfile: Containerfile.pkg
      args:
        BASE_VERSION: "15-latest"
